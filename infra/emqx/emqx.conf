## EMQX 5.8 — Aqua Sentinel v2 Local Developer Configuration
## Phase 2 activates HTTP AuthN & Per-Device Topic ACLs:
##   POST http://host.docker.internal:8000/internal/emqx/auth
##   POST http://host.docker.internal:8000/internal/emqx/acl

node {
  name = "emqx@127.0.0.1"
  data_dir = "data"
}

cluster {
  name = aqua_emqx
  discovery_strategy = manual
}

dashboard {
  listeners.http {
    bind = 18083
  }
}

listeners.tcp.default {
  bind = "0.0.0.0:1883"
  max_connections = 102400
}