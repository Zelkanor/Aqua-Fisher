[project]
name = "aqua-contracts"
version = "2.0.0"
description = "Canonical Pydantic v2 telemetry, compliance, and event contracts for Aqua Fisher v2"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/aqua_contracts"]