name: mobile
description: "Aqua Fisher v2 Mobile Field Companion"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.14.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0

  # Internal Workspace Contract SDK
  aqua_dart_sdk: ^2.0.0

  # Networking
  dio: 5.11.1
  freezed_annotation: 3.1.0
  json_annotation: 4.12.0

  # State Management & Navigation
  flutter_riverpod: 3.5.0
  go_router: 18.1.4

  # Auth & Push Notifications
  firebase_core: 5.2.0
  firebase_auth: 7.1.0
  firebase_messaging: 17.1.0
  flutter_local_notifications: 23.0.3

  # Lightweight 2D Field Map
  flutter_map: 8.3.2
  latlong2: 0.10.1

  # Offline SQLite Cache (Drift)
  path: 1.9.1
  path_provider: 2.1.6
  drift: 2.35.4
  sqlite3: 3.9.1

dev_dependencies:
  build_runner: ^2.17.1
  freezed: 4.0.3
  drift_dev: ^2.35.3
  json_serializable: 6.15.2
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
