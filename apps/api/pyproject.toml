[project]
name = "aqua-api"
version = "2.0.0"
description = "Aqua Fisher v2 FastAPI Core, MQTT Ingestor, Alert Engine, and WebSocket Gateway"
requires-python = ">=3.12"
dependencies = [
    "aqua-contracts",
    "aiomqtt>=2.3.0",
    "alembic>=1.14.0",
    "argon2-cffi>=23.1.0",
    "arq>=0.26.1",
    "asyncpg>=0.30.0",
    "boto3>=1.35.0",
    "fastapi>=0.115.0",
    "firebase-admin>=6.6.0",
    "geoalchemy2>=0.15.2",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "pyjwt[crypto]>=2.10.0",
    "redis>=5.2.0",
    "shapely>=2.0.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "structlog>=24.4.0",
    "uvicorn[standard]>=0.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aqua_api"]