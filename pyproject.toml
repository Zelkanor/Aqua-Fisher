[project]
name = "aqua-fisher-workspace"
version = "2.0.0"
description = "Aqua Fisher v2 polyglot monorepo Python workspace"
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/contracts",
    "apps/api",
    "apps/workers",
    "tools/drone-simulator",
]

[tool.uv.sources]
aqua-contracts = { workspace = true }

[dependency-groups]
dev = [
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "testcontainers[postgres,redis]>=4.8.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = [
    "packages/contracts/python",
    "apps/api/src",
    "apps/workers/src",
    "tools/drone-simulator",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "ASYNC", "RUF"]
ignore = ["B008"] # Allow FastAPI Depends() in parameter defaults

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = [
    "packages/contracts/tests",
    "apps/api/tests",
    "apps/workers/tests",
]